<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DECOMOL - Fichaje Rápido</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        h3 { text-align: center; color: #666; font-size: 14px; margin-top: 20px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; color: white; border: none; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-in { background: #28a745; }
        .btn-in:hover { background: #218838; }
        .btn-out { background: #dc3545; }
        .btn-out:hover { background: #c82333; }
        .btn-task { background: #007bff; margin-top: 20px; }
        .btn-task:hover { background: #0056b3; }
        #message_box { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 16px; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); color: white; font-weight: bold; z-index: 50; transition: opacity 0.3s ease; }
        #message_box.hidden { opacity: 0; pointer-events: none; }
        #message_box.success-message { background: #28a745; }
        #message_box.error-message { background: #dc3545; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 4px; text-align: center; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div id="message_box" class="hidden"></div>

<div class="card">
    <h2>DECOMOL</h2>
    
    <label for="emp">Código Empleado:</label>
    <input type="text" id="emp" value="OP-001">

    <label for="emp_password">Contraseña (solo fichaje):</label>
    <input type="password" id="emp_password" placeholder="Solo para entrada/salida">
    <small style="display:block; margin-top: 6px; color:#666; font-size:12px;">No se usa para la tarea de obra.</small>

    <h3>Fichaje General (Nave)</h3>
    <div class="row">
        <button class="btn-in" onclick="ficharPresencia('CLOCK_IN')">Fichar Entrada</button>
        <button class="btn-out" onclick="ficharPresencia('CLOCK_OUT')">Fichar Salida</button>
    </div>

    <h3>Imputación por Obra</h3>
    <div style="margin-top: 8px; color: #666; font-size: 12px; text-align: center;">Sin contraseña • solo cronómetro</div>
    <label for="cli">Código Cliente / Obra:</label>
    <input type="text" id="cli" placeholder="Ej: 5480">

    <div id="cronometro" style="display: none; font-size: 16px; text-align: center; margin-top: 10px; color: #dc3545; font-weight: bold;">
        ⏱️ Cronómetro en marcha...
    </div>

    <button id="btn-accion-obra" class="btn-task" onclick="toggleTarea()">▶️ Empezar Tarea de Obra</button>

    <div id="resultado"></div>
</div>

<script>
    const API_BASE_URL = "https://decomol-api.onrender.com";

    function mostrarMensaje(texto, esError) {
        const box = document.getElementById('message_box');
        box.textContent = texto;
        box.className = '';
        box.classList.add(esError ? 'error-message' : 'success-message');
        box.classList.remove('hidden');
        setTimeout(() => box.classList.add('hidden'), 4000);
    }

    async function toggleTarea() {
        const btn = document.getElementById('btn-accion-obra');
        const crono = document.getElementById('cronometro');
        const cliInput = document.getElementById('cli');
        const emp = document.getElementById('emp').value;
        const resDiv = document.getElementById('resultado');

        let tareaActiva = localStorage.getItem('tarea_activa');

        if (!tareaActiva) {
            const cli = cliInput.value.trim();
            if (!cli) {
                resDiv.className = 'error';
                resDiv.innerText = '⚠️ Escribe la obra en la que vas a empezar.';
                return;
            }

            const datosTarea = { obra: cli, horaInicio: Date.now() };
            localStorage.setItem('tarea_activa', JSON.stringify(datosTarea));

            cliInput.disabled = true;
            crono.style.display = 'block';
            crono.innerText = `⏱️ Trabajando en la obra ${cli}...`;
            btn.innerHTML = '⏹️ Terminar Tarea de Obra';
            btn.style.backgroundColor = '#dc3545';
            resDiv.className = 'success';
            resDiv.innerText = '¡Cronómetro iniciado!';
            return;
        }

        const datosGuardados = JSON.parse(tareaActiva);
        const ahora = Date.now();
        let minutosCalculados = Math.round((ahora - datosGuardados.horaInicio) / 60000);
        if (minutosCalculados < 1) minutosCalculados = 1;

        const url = `${API_BASE_URL}/api/v1/time/task?employee_code=${emp}&client_code=${datosGuardados.obra}&duration_minutes=${minutosCalculados}`;

        try {
            const response = await fetch(url, { method: 'POST' });
            const data = await response.json();

            if (response.ok) {
                resDiv.className = 'success';
                resDiv.innerText = `¡Genial! Has sumado ${minutosCalculados} min a la obra ${datosGuardados.obra}.`;

                localStorage.removeItem('tarea_activa');
                cliInput.disabled = false;
                cliInput.value = '';
                crono.style.display = 'none';
                btn.innerHTML = '▶️ Empezar Tarea de Obra';
                btn.style.backgroundColor = '#007bff';
            } else {
                resDiv.className = 'error';
                resDiv.innerText = 'Error: ' + (data.detail || 'No se pudo registrar');
            }
        } catch (error) {
            resDiv.className = 'error';
            resDiv.innerText = 'Error de conexión con el servidor.';
        }
    }

    async function ficharPresencia(action) {
        const emp = document.getElementById('emp').value;
        const pass = document.getElementById('emp_password').value;

        const url = `${API_BASE_URL}/api/v1/time/clock?employee_code=${emp}&action=${action}&password=${pass}`;

        try {
            const response = await fetch(url, { method: 'POST' });
            const data = await response.json();

            if (response.ok) {
                mostrarMensaje(data.mensaje || '¡Fichaje registrado correctamente!', false);
            } else {
                mostrarMensaje(data.detail || 'Error al fichar. Revisa tu clave.', true);
            }
        } catch (error) {
            mostrarMensaje('Error de conexión con el servidor', true);
        }
    }
</script>

</body>
</html>
