<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUSMOLD CLOUD - Fichaje</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h2 {
            color: #333;
            margin-top: 0;
            font-size: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        button {
            width: 100%;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-in { background: #28a745; }
        .btn-in:hover { background: #218838; }
        .btn-out { background: #dc3545; }
        .btn-out:hover { background: #c82333; }
        .btn-task { background: #007bff; }
        .btn-task:hover { background: #0056b3; }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .crono {
            display: none;
            font-size: 16px;
            text-align: center;
            margin-top: 15px;
            color: #dc3545;
            font-weight: bold;
            background: #ffeeba;
            padding: 10px;
            border-radius: 6px;
        }

        #resultado {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block !important;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block !important;
        }
    </style>
</head>
<body onload="revisarMemoria()">

    <div class="card" style="padding-bottom: 15px;">
        <label for="emp">👷 Tu Código de Empleado:</label>
        <input type="text" id="emp" placeholder="Ej: OP-001">
    </div>

    <div class="card">
        <h2>🏭 Fichaje de Taller</h2>

        <label for="pass">🔑 Tu Contraseña secreta:</label>
        <input type="password" id="pass" placeholder="Pon tu clave aquí">

        <div class="row">
            <button class="btn-in" onclick="ficharTaller('CLOCK_IN')">🟢 Entrar Taller</button>
            <button class="btn-out" onclick="ficharTaller('CLOCK_OUT')">🔴 Salir Taller</button>
        </div>
    </div>

    <div class="card">
        <h2>🏗️ Tareas de Obra</h2>
        <p style="font-size: 12px; color: #666; text-align: center; margin-top: 0;">(No necesitas contraseña para cambiar de obra)</p>

        <label for="cli">Código de la Obra:</label>
        <input type="text" id="cli" placeholder="Ej: 5480">

        <div id="cronometro" class="crono">⏱️ Cronómetro en marcha...</div>

        <button id="btn-empezar" class="btn-task" onclick="empezarObra()">▶️ Empezar Obra</button>
        <button id="btn-terminar" class="btn-out" style="display: none;" onclick="terminarObra()">⏹️ Terminar Obra</button>
    </div>

    <div id="resultado" style="width: 100%; max-width: 350px;"></div>

<script>
    const API_BASE_URL = "https://decomol-api.onrender.com";

    function mostrarMensaje(texto, tipo) {
        const resDiv = document.getElementById('resultado');
        resDiv.className = tipo;
        resDiv.innerText = texto;
        resDiv.style.display = 'block';
        setTimeout(() => { resDiv.style.display = 'none'; }, 5000);
    }

    async function ficharTaller(tipo) {
        const emp = document.getElementById('emp').value;
        const pass = document.getElementById('pass').value;

        if (!emp || !pass) {
            return mostrarMensaje('⚠️ Pon tu código y contraseña para el Taller.', 'error');
        }

        const url = `${API_BASE_URL}/api/v1/time/clock?employee_code=${emp}&entry_type=${tipo}&location=Taller&password=${pass}`;

        try {
            const response = await fetch(url, { method: 'POST' });
            const data = await response.json();

            if (response.ok) {
                mostrarMensaje(data.mensaje, 'success');
                document.getElementById('pass').value = '';

                if (data.token) {
                    localStorage.setItem('pulsera_vip', data.token);
                }
            } else {
                mostrarMensaje('Error: ' + (data.detail || 'Contraseña incorrecta'), 'error');
            }
        } catch (error) {
            mostrarMensaje('Error de conexión.', 'error');
        }
    }

    function empezarObra() {
        const emp = document.getElementById('emp').value;
        const cli = document.getElementById('cli').value;

        if (!emp || !cli) {
            return mostrarMensaje('⚠️ Faltan datos del empleado u obra.', 'error');
        }

        const datosTarea = { obra: cli, horaInicio: Date.now() };
        localStorage.setItem('tarea_activa', JSON.stringify(datosTarea));

        activarModoTrabajando(cli);
        mostrarMensaje('¡Cronómetro iniciado!', 'success');
    }

    async function terminarObra() {
        const emp = document.getElementById('emp').value;
        if (!emp) {
            return mostrarMensaje('⚠️ Pon tu código de empleado.', 'error');
        }

        let tareaActiva = localStorage.getItem('tarea_activa');
        if (!tareaActiva) return;

        const datosGuardados = JSON.parse(tareaActiva);
        const ahora = Date.now();

        let minutosCalculados = Math.round((ahora - datosGuardados.horaInicio) / 60000);
        if (minutosCalculados < 1) minutosCalculados = 1;

        const pulsera = localStorage.getItem('pulsera_vip');
        const url = `${API_BASE_URL}/api/v1/time/task?employee_code=${emp}&client_code=${datosGuardados.obra}&duration_minutes=${minutosCalculados}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${pulsera}`
                }
            });
            const data = await response.json();

            if (response.ok) {
                mostrarMensaje(`¡Anotados ${minutosCalculados} min a la obra ${datosGuardados.obra}!`, 'success');
                localStorage.removeItem('tarea_activa');
                desactivarModoTrabajando();
            } else {
                mostrarMensaje('Error: ' + (data.detail || 'No se pudo registrar'), 'error');
            }
        } catch (error) {
            mostrarMensaje('Error de conexión.', 'error');
        }
    }

    function activarModoTrabajando(obra) {
        document.getElementById('cli').value = obra;
        document.getElementById('cli').disabled = true;
        document.getElementById('btn-empezar').style.display = 'none';
        document.getElementById('btn-terminar').style.display = 'block';
        document.getElementById('cronometro').style.display = 'block';
    }

    function desactivarModoTrabajando() {
        document.getElementById('cli').value = '';
        document.getElementById('cli').disabled = false;
        document.getElementById('btn-empezar').style.display = 'block';
        document.getElementById('btn-terminar').style.display = 'none';
        document.getElementById('cronometro').style.display = 'none';
    }

    function revisarMemoria() {
        let tareaActiva = localStorage.getItem('tarea_activa');
        if (tareaActiva) {
            const datosGuardados = JSON.parse(tareaActiva);
            activarModoTrabajando(datosGuardados.obra);
        }
    }
</script>

</body>
</html>
