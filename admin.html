<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUSMOLD CLOUD - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800">
    <div id="message_box" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 p-4 rounded-lg shadow-xl text-white font-bold z-50 transition-all"></div>

    <header class="bg-gray-900 text-white shadow-lg py-4 px-6 md:px-12 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">NEXUSMOLD CLOUD ADMIN</h1>
            <p class="text-gray-400 text-sm">Panel de Control de Recursos Humanos</p>
        </div>
        <a href="index.html" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition">Ir a Fichar</a>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 space-y-8">
            <section class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
                <h2 class="text-xl font-bold mb-4 flex items-center text-gray-700">Restablecer Contraseña</h2>
                <p class="text-sm text-gray-500 mb-4">Usa esta herramienta si un trabajador ha olvidado su clave.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Código Empleado:</label>
                        <input type="text" id="reset_emp_code" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: OP-001">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Nueva Contraseña:</label>
                        <input type="password" id="reset_new_password" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nueva clave">
                    </div>
                    <button onclick="cambiarPassword()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition shadow">Cambiar Contraseña</button>
                </div>
            </section>
        </div>

        <div class="lg:col-span-2">
            <section class="bg-white rounded-xl shadow-md p-6 border border-gray-100 h-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-700">Últimos Fichajes (Tiempo Real)</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="cargarRegistros()" class="text-blue-600 hover:text-blue-800 flex items-center text-sm font-semibold">Actualizar</button>
                        <button onclick="descargarExcel()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm transition">📊 Descargar Excel</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-3 font-semibold">Fecha y Hora</th>
                                <th class="p-3 font-semibold">Empleado</th>
                                <th class="p-3 font-semibold">Tipo</th>
                                <th class="p-3 font-semibold">Cliente/Obra</th>
                                <th class="p-3 font-semibold text-right">Duración</th>
                            </tr>
                        </thead>
                        <tbody id="tabla_registros" class="divide-y divide-gray-100 text-sm">
                            <tr><td colspan="5" class="p-8 text-center text-gray-400">Cargando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_BASE_URL = "https://decomol-api.onrender.com";

        function mostrarMensaje(texto, esError) {
            const box = document.getElementById('message_box');
            box.textContent = texto;
            box.className = `fixed top-4 left-1/2 transform -translate-x-1/2 p-4 rounded-lg shadow-xl text-white font-bold z-50 transition-all duration-300 ${esError ? 'bg-red-500' : 'bg-green-600'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        async function cambiarPassword() {
            const empCode = document.getElementById('reset_emp_code').value.trim();
            const newPass = document.getElementById('reset_new_password').value.trim();
            if (!empCode || !newPass) {
                mostrarMensaje("Rellena ambos campos", true);
                return;
            }

            const url = `${API_BASE_URL}/api/v1/users/${encodeURIComponent(empCode)}/reset-password?new_password=${encodeURIComponent(newPass)}`;
            try {
                const response = await fetch(url, { method: 'PUT' });
                const data = await response.json();
                if (!response.ok) {
                    mostrarMensaje(data.detail || "Error al cambiar la contraseña", true);
                } else {
                    mostrarMensaje("Contraseña actualizada con éxito", false);
                    document.getElementById('reset_emp_code').value = '';
                    document.getElementById('reset_new_password').value = '';
                }
            } catch (error) {
                mostrarMensaje("Error de red", true);
            }
        }

        async function cargarRegistros() {
            const tbody = document.getElementById('tabla_registros');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500 animate-pulse">Cargando datos...</td></tr>';
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/time/entries`);
                if (!response.ok) throw new Error("Fallo al obtener datos");
                const registros = await response.json();
                tbody.innerHTML = '';
                if (registros.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">No hay registros recientes</td></tr>';
                    return;
                }

                registros.forEach(reg => {
                    const fecha = new Date(reg.timestamp).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
                    let badgeClass = "bg-gray-100 text-gray-800";
                    if (reg.entry_type === 'CLOCK_IN') badgeClass = "bg-green-100 text-green-800 border border-green-200";
                    if (reg.entry_type === 'CLOCK_OUT') badgeClass = "bg-red-100 text-red-800 border border-red-200";
                    if (reg.entry_type === 'TASK') badgeClass = "bg-blue-100 text-blue-800 border border-blue-200";
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="p-3 whitespace-nowrap">${fecha}</td>
                        <td class="p-3 font-medium text-gray-900">${reg.employee_code || reg.user_id || '-'}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-bold ${badgeClass}">${reg.entry_type}</span></td>
                        <td class="p-3">${reg.client_code || reg.project_id || '-'}</td>
                        <td class="p-3 text-right font-mono">${reg.duration_minutes ? reg.duration_minutes + ' min' : '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">Error de conexión al servidor</td></tr>';
            }
        }

        function descargarExcel() {
            window.open(`${API_BASE_URL}/api/v1/time/export/excel`);
        }

        window.onload = cargarRegistros;
    </script>
</body>
</html>
